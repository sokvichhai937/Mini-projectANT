<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article Detail - Blog Management System</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/sidebar.css">
    <style>
        .article-thumbnail {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 2rem;
        }
        
        .article-content {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #333;
            margin-bottom: 2rem;
        }
        
        .article-author-card {
            background-color: #f8f9fa;
            border-left: 4px solid #0d6efd;
        }
        
        .author-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <!-- Sidebar Overlay for Mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    
    <!-- Dark Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="/pages/dashboard.html" class="sidebar-brand">
                <i class="bi bi-journal-text"></i>
                Blog
            </a>
        </div>
        
        <nav class="sidebar-menu">
            <div class="sidebar-section-title">ADMIN</div>
            <ul class="sidebar-nav">
                <li>
                    <a href="/pages/dashboard.html" class="nav-link">
                        <i class="bi bi-speedometer2"></i>
                        Dashboard
                    </a>
                </li>
                <li class="has-submenu open">
                    <a href="#" class="nav-link submenu-toggle" onclick="toggleSubmenu(event)">
                        <span><i class="bi bi-file-text"></i> My Article</span>
                    </a>
                    <ul class="submenu">
                        <li><a href="/pages/articles.html" class="nav-link active">All Articles</a></li>
                        <li><a href="/pages/my-articles.html" class="nav-link">My Articles</a></li>
                        <li><a href="/pages/create-article.html" class="nav-link">Create Article</a></li>
                    </ul>
                </li>
                <li>
                    <a href="/pages/categories.html" class="nav-link">
                        <i class="bi bi-tags"></i>
                        Categories
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-link logout" onclick="handleLogout(event)">
                        <i class="bi bi-box-arrow-right"></i>
                        Logout
                    </a>
                </li>
            </ul>
        </nav>
    </aside>
    
    <!-- Main Content -->
    <div class="main-content">
        <!-- Top Navbar -->
        <nav class="top-navbar">
            <button class="navbar-toggle-btn" id="sidebarToggle" onclick="toggleSidebar()">
                <i class="bi bi-list"></i>
            </button>
            <div class="user-dropdown">
                <img src="https://ui-avatars.com/api/?name=User&background=4299e1&color=fff" alt="User Avatar" class="user-avatar" id="userAvatar">
                <div class="user-info">
                    <div class="user-name" id="userName">Loading...</div>
                </div>
            </div>
        </nav>
        
        <!-- Article Detail Content -->
        <div class="container-fluid p-4">
            <!-- Loading State -->
            <div id="loadingState" class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3 text-muted">Loading article...</p>
            </div>
            
            <!-- Article Content -->
            <div id="articleContent" style="display: none;">
                <!-- Back Button and Action Buttons -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <button onclick="goBack()" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-2"></i>Back
                    </button>
                    <div id="ownerActions" style="display: none;">
                        <a href="#" id="editButton" class="btn btn-outline-primary me-2">
                            <i class="bi bi-pencil me-2"></i>Edit
                        </a>
                        <button onclick="confirmDelete()" class="btn btn-outline-danger">
                            <i class="bi bi-trash me-2"></i>Delete
                        </button>
                    </div>
                </div>
                
                <!-- Article Card -->
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <!-- Category Badge -->
                        <div class="mb-3">
                            <span id="categoryBadge" class="badge bg-primary"></span>
                        </div>
                        
                        <!-- Article Title -->
                        <h1 class="display-5 fw-bold mb-3" id="articleTitle"></h1>
                        
                        <!-- Author Info and Date -->
                        <div class="d-flex align-items-center mb-4 pb-4 border-bottom">
                            <img id="authorAvatar" src="" alt="Author" class="author-avatar me-3">
                            <div>
                                <div class="fw-bold" id="authorName"></div>
                                <div class="text-muted small">
                                    <i class="bi bi-calendar me-1"></i>
                                    <span id="articleDate"></span>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Thumbnail Image -->
                        <div id="thumbnailContainer" class="mb-4" style="display: none;">
                            <img id="articleThumbnail" src="" alt="Article Thumbnail" class="article-thumbnail">
                        </div>
                        
                        <!-- Article Content -->
                        <div id="articleBody" class="article-content"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold" id="deleteModalLabel">
                        <i class="bi bi-exclamation-triangle text-danger me-2"></i>Confirm Delete
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-0">Are you sure you want to delete this article? This action cannot be undone.</p>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" onclick="deleteArticle()">
                        <i class="bi bi-trash me-2"></i>Delete
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Toast Container -->
    <div class="toast-container position-fixed top-0 end-0 p-3">
        <div id="toast" class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toastBody"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS -->
    <script src="../js/config.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    
    <script>
        let currentArticleId = null;
        let deleteModalInstance = null;
        
        // Sidebar toggle for mobile
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('show');
            overlay.classList.toggle('show');
        }
        
        // Submenu toggle
        function toggleSubmenu(event) {
            event.preventDefault();
            const parent = event.currentTarget.closest('.has-submenu');
            parent.classList.toggle('open');
        }
        
        // Handle logout
        async function handleLogout(event) {
            event.preventDefault();
            if (confirm('Are you sure you want to logout?')) {
                logout();
            }
        }
        
        // Go back
        function goBack() {
            window.history.back();
        }
        
        // Show toast notification
        function showToastNotification(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastBody = document.getElementById('toastBody');
            
            toastBody.textContent = message;
            toast.className = 'toast align-items-center border-0';
            
            if (type === 'success') {
                toast.classList.add('bg-success', 'text-white');
            } else if (type === 'error') {
                toast.classList.add('bg-danger', 'text-white');
            }
            
            const bsToast = new bootstrap.Toast(toast);
            bsToast.show();
        }
        
        // Load article details
        async function loadArticleDetail() {
            // Check authentication
            if (!isAuthenticated()) {
                window.location.href = '/index.html';
                return;
            }
            
            // Get article ID from URL
            const articleId = getQueryParam('id');
            if (!articleId) {
                showToastNotification('Article ID not found', 'error');
                setTimeout(() => window.location.href = '/pages/articles.html', 2000);
                return;
            }
            
            currentArticleId = articleId;
            
            try {
                // Load user info
                const userData = getUserData();
                if (userData) {
                    const fullName = `${userData.firstName} ${userData.lastName}`;
                    document.getElementById('userName').textContent = fullName;
                    
                    // Update avatar
                    const avatar = document.getElementById('userAvatar');
                    avatar.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(fullName)}&background=4299e1&color=fff`;
                }
                
                // Load article details
                const article = await articlesAPI.getById(articleId);
                
                // Check ownership
                const isOwner = userData && userData.id === article.creatorId;
                
                // Display article
                displayArticle(article, isOwner);
                
            } catch (error) {
                console.error('Load article error:', error);
                document.getElementById('loadingState').innerHTML = `
                    <div class="alert alert-danger" role="alert">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        Failed to load article. ${error.message || 'Please try again.'}
                    </div>
                    <button onclick="window.location.href='/pages/articles.html'" class="btn btn-primary">
                        Back to Articles
                    </button>
                `;
            }
        }
        
        // Display article
        function displayArticle(article, isOwner) {
            // Hide loading, show content
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('articleContent').style.display = 'block';
            
            // Category
            document.getElementById('categoryBadge').textContent = article.category?.name || 'Uncategorized';
            
            // Title
            document.getElementById('articleTitle').textContent = article.title;
            
            // Author
            const authorFullName = `${article.creator?.firstName || ''} ${article.creator?.lastName || ''}`.trim();
            document.getElementById('authorName').textContent = authorFullName || 'Unknown';
            const authorAvatarUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(authorFullName)}&background=6c757d&color=fff`;
            document.getElementById('authorAvatar').src = authorAvatarUrl;
            
            // Date
            document.getElementById('articleDate').textContent = formatDate(article.createdAt);
            
            // Thumbnail
            if (article.thumbnail) {
                document.getElementById('thumbnailContainer').style.display = 'block';
                document.getElementById('articleThumbnail').src = getImageUrl(article.thumbnail);
                document.getElementById('articleThumbnail').alt = article.title;
            }
            
            // Content
            const contentHtml = sanitizeHTML(article.content).replace(/\n/g, '<br>');
            document.getElementById('articleBody').innerHTML = contentHtml;
            
            // Show owner actions
            if (isOwner) {
                document.getElementById('ownerActions').style.display = 'block';
                document.getElementById('editButton').href = `/pages/create-article.html?id=${article.id}`;
            }
        }
        
        // Confirm delete
        function confirmDelete() {
            if (!deleteModalInstance) {
                deleteModalInstance = new bootstrap.Modal(document.getElementById('deleteModal'));
            }
            deleteModalInstance.show();
        }
        
        // Delete article
        async function deleteArticle() {
            if (!currentArticleId) return;
            
            try {
                await articlesAPI.delete(currentArticleId);
                
                // Hide modal
                if (deleteModalInstance) {
                    deleteModalInstance.hide();
                }
                
                showToastNotification('Article deleted successfully', 'success');
                
                // Redirect after short delay
                setTimeout(() => {
                    window.location.href = '/pages/articles.html';
                }, 1500);
                
            } catch (error) {
                console.error('Delete article error:', error);
                showToastNotification(error.message || 'Failed to delete article', 'error');
            }
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', loadArticleDetail);
    </script>
</body>
</html>
