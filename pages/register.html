<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ចុះឈ្មោះ - Blog Management System</title>
    
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/auth.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px 0;
        }
        
        .auth-container {
            width: 100%;
            max-width: 500px;
            padding: 15px;
        }
        
        .auth-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            padding: 2.5rem;
        }
        
        .auth-logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .auth-logo h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #2d3748;
            margin: 0;
        }
        
        .auth-logo p {
            color: #718096;
            margin-top: 0.5rem;
        }
        
        .btn-dark {
            background-color: #2d3748;
            border-color: #2d3748;
        }
        
        .btn-dark:hover {
            background-color: #1a202c;
            border-color: #1a202c;
        }
        
        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
        }
        
        .form-text {
            font-size: 0.875rem;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <h1><i class="bi bi-journal-text"></i> Blog</h1>
                <p>បង្កើតគណនីថ្មីរបស់អ្នក</p>
            </div>
            
            <form id="registerForm">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="firstName" class="form-label">នាមខ្លួន</label>
                        <input type="text" class="form-control" id="firstName" placeholder="បញ្ចូលនាមខ្លួន" required>
                        <div class="invalid-feedback" id="firstNameError"></div>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label for="lastName" class="form-label">នាមត្រកូល</label>
                        <input type="text" class="form-control" id="lastName" placeholder="បញ្ចូលនាមត្រកូល" required>
                        <div class="invalid-feedback" id="lastNameError"></div>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="email" class="form-label">អ៊ីមែល</label>
                    <input type="email" class="form-control" id="email" placeholder="example@email.com" required>
                    <div class="invalid-feedback" id="emailError"></div>
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label">លេខសម្ងាត់</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="password" placeholder="បញ្ចូលលេខសម្ងាត់" required>
                        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('password', 'toggleIcon1')">
                            <i class="bi bi-eye" id="toggleIcon1"></i>
                        </button>
                    </div>
                    <div class="form-text">លេខសម្ងាត់ត្រូវមានយ៉ាងតិច ៨ តួអក្សរ</div>
                    <div class="invalid-feedback" id="passwordError"></div>
                </div>
                
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">បញ្ជាក់លេខសម្ងាត់</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="confirmPassword" placeholder="បញ្ចូលលេខសម្ងាត់ម្តងទៀត" required>
                        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('confirmPassword', 'toggleIcon2')">
                            <i class="bi bi-eye" id="toggleIcon2"></i>
                        </button>
                    </div>
                    <div class="invalid-feedback" id="confirmPasswordError"></div>
                </div>
                
                <button type="submit" class="btn btn-dark w-100 mb-3" id="registerBtn">
                    <i class="bi bi-person-plus me-2"></i>ចុះឈ្មោះ
                </button>
            </form>
            
            <div class="auth-footer">
                <p class="mb-0">មានគណនីរួចហើយ? <a href="login.html" class="text-decoration-none">ចូលប្រើប្រាស់</a></p>
            </div>
        </div>
    </div>
    
    <!-- Toast Container -->
    <div class="toast-container position-fixed top-0 end-0 p-3">
        <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header" id="toastHeader">
                <strong class="me-auto" id="toastTitle">Notification</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastBody"></div>
        </div>
    </div>
    
    <!-- Bootstrap 5.3 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="../js/config.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script>
        // Toggle password visibility
        function togglePassword(fieldId, iconId) {
            const field = document.getElementById(fieldId);
            const icon = document.getElementById(iconId);
            if (field.type === 'password') {
                field.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                field.type = 'password';
                icon.className = 'bi bi-eye';
            }
        }
        
        // Handle form submission
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Clear previous errors
            document.getElementById('firstNameError').textContent = '';
            document.getElementById('lastNameError').textContent = '';
            document.getElementById('emailError').textContent = '';
            document.getElementById('passwordError').textContent = '';
            document.getElementById('confirmPasswordError').textContent = '';
            
            // Remove invalid classes
            ['firstName', 'lastName', 'email', 'password', 'confirmPassword'].forEach(id => {
                document.getElementById(id).classList.remove('is-invalid');
            });
            
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // Validation
            let hasError = false;
            
            if (!firstName) {
                document.getElementById('firstNameError').textContent = 'សូមបញ្ចូលនាមខ្លួន';
                document.getElementById('firstName').classList.add('is-invalid');
                hasError = true;
            }
            
            if (!lastName) {
                document.getElementById('lastNameError').textContent = 'សូមបញ្ចូលនាមត្រកូល';
                document.getElementById('lastName').classList.add('is-invalid');
                hasError = true;
            }
            
            if (!validateEmail(email)) {
                document.getElementById('emailError').textContent = 'សូមបញ្ចូលអ៊ីមែលត្រឹមត្រូវ';
                document.getElementById('email').classList.add('is-invalid');
                hasError = true;
            }
            
            if (!password || password.length < 8) {
                document.getElementById('passwordError').textContent = 'លេខសម្ងាត់ត្រូវមានយ៉ាងតិច ៨ តួអក្សរ';
                document.getElementById('password').classList.add('is-invalid');
                hasError = true;
            }
            
            if (password !== confirmPassword) {
                document.getElementById('confirmPasswordError').textContent = 'លេខសម្ងាត់មិនត្រូវគ្នា';
                document.getElementById('confirmPassword').classList.add('is-invalid');
                hasError = true;
            }
            
            if (hasError) return;
            
            // Disable button and show loading
            const registerBtn = document.getElementById('registerBtn');
            const originalText = registerBtn.innerHTML;
            registerBtn.disabled = true;
            registerBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>កំពុងចុះឈ្មោះ...';
            
            try {
                await authAPI.register({
                    firstName,
                    lastName,
                    email,
                    password,
                    confirmPassword: password
                });
                
                showToast('ចុះឈ្មោះជោគជ័យ! សូមចូលប្រើប្រាស់', 'success');
                
                // Redirect to login
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
            } catch (error) {
                showToast(error.message || 'ចុះឈ្មោះបរាជ័យ', 'error');
                registerBtn.disabled = false;
                registerBtn.innerHTML = originalText;
            }
        });
        
        // Redirect if already logged in
        if (isAuthenticated()) {
            window.location.href = '/pages/dashboard.html';
        }
    </script>
</body>
</html>
