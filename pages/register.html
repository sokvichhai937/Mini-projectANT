<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ចុះឈ្មោះ - Blog Management System</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-title">ចុះឈ្មោះ</h1>
                <p class="auth-subtitle">បង្កើតគណនីថ្មីរបស់អ្នក</p>
            </div>
            
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="firstName" class="form-label">នាមខ្លួន</label>
                    <input type="text" id="firstName" class="form-control" placeholder="បញ្ចូលនាមខ្លួន" required>
                    <span class="invalid-feedback" id="firstNameError"></span>
                </div>
                
                <div class="form-group">
                    <label for="lastName" class="form-label">នាមត្រកូល</label>
                    <input type="text" id="lastName" class="form-control" placeholder="បញ្ចូលនាមត្រកូល" required>
                    <span class="invalid-feedback" id="lastNameError"></span>
                </div>
                
                <div class="form-group">
                    <label for="email" class="form-label">អ៊ីមែល</label>
                    <input type="email" id="email" class="form-control" placeholder="example@email.com" required>
                    <span class="invalid-feedback" id="emailError"></span>
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">លេខសម្ងាត់</label>
                    <div class="password-toggle">
                        <input type="password" id="password" class="form-control" placeholder="បញ្ចូលលេខសម្ងាត់" required>
                        <button type="button" class="password-toggle-btn" onclick="togglePassword('password')">👁️</button>
                    </div>
                    <span class="form-text">លេខសម្ងាត់ត្រូវមានយ៉ាងតិច ៦ តួអក្សរ</span>
                    <span class="invalid-feedback" id="passwordError"></span>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword" class="form-label">បញ្ជាក់លេខសម្ងាត់</label>
                    <div class="password-toggle">
                        <input type="password" id="confirmPassword" class="form-control" placeholder="បញ្ចូលលេខសម្ងាត់ម្តងទៀត" required>
                        <button type="button" class="password-toggle-btn" onclick="togglePassword('confirmPassword')">👁️</button>
                    </div>
                    <span class="invalid-feedback" id="confirmPasswordError"></span>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block btn-lg" id="registerBtn">
                    ចុះឈ្មោះ
                </button>
            </form>
            
            <div class="auth-footer">
                <p>មានគណនីរួចហើយ? <a href="login.html">ចូលប្រើប្រាស់</a></p>
            </div>
        </div>
    </div>
    
    <script src="../js/config.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script>
        // Toggle password visibility
        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            field.type = field.type === 'password' ? 'text' : 'password';
        }
        
        // Handle form submission
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Clear previous errors
            document.getElementById('firstNameError').textContent = '';
            document.getElementById('lastNameError').textContent = '';
            document.getElementById('emailError').textContent = '';
            document.getElementById('passwordError').textContent = '';
            document.getElementById('confirmPasswordError').textContent = '';
            
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // Validation
            let hasError = false;
            
            if (!firstName) {
                document.getElementById('firstNameError').textContent = 'សូមបញ្ចូលនាមខ្លួន';
                hasError = true;
            }
            
            if (!lastName) {
                document.getElementById('lastNameError').textContent = 'សូមបញ្ចូលនាមត្រកូល';
                hasError = true;
            }
            
            if (!validateEmail(email)) {
                document.getElementById('emailError').textContent = 'សូមបញ្ចូលអ៊ីមែលត្រឹមត្រូវ';
                hasError = true;
            }
            
            if (!validatePassword(password)) {
                document.getElementById('passwordError').textContent = 'លេខសម្ងាត់ត្រូវមានយ៉ាងតិច ៦ តួអក្សរ';
                hasError = true;
            }
            
            if (password !== confirmPassword) {
                document.getElementById('confirmPasswordError').textContent = 'លេខសម្ងាត់មិនត្រូវគ្នា';
                hasError = true;
            }
            
            if (hasError) return;
            
            // Disable button and show loading
            const registerBtn = document.getElementById('registerBtn');
            registerBtn.disabled = true;
            registerBtn.textContent = 'កំពុងចុះឈ្មោះ...';
            
            try {
                await authAPI.register({
                    firstName,
                    lastName,
                    email,
                    password
                });
                
                showToast('ចុះឈ្មោះជោគជ័យ! សូមចូលប្រើប្រាស់', 'success');
                
                // Redirect to login
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1000);
            } catch (error) {
                showToast(error.message || 'ចុះឈ្មោះបរាជ័យ', 'error');
                registerBtn.disabled = false;
                registerBtn.textContent = 'ចុះឈ្មោះ';
            }
        });
    </script>
</body>
</html>
