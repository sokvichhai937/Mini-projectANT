<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>អត្ថបទទាំងអស់ - Blog Management System</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body>
    <!-- Sidebar Overlay for Mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    
    <!-- Dark Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="/pages/dashboard.html" class="sidebar-brand">
                <i class="bi bi-journal-text"></i>
                Blog
            </a>
        </div>
        
        <nav class="sidebar-menu">
            <div class="sidebar-section-title">ADMIN</div>
            <ul class="sidebar-nav">
                <li>
                    <a href="/pages/dashboard.html" class="nav-link">
                        <i class="bi bi-speedometer2"></i>
                        Dashboard
                    </a>
                </li>
                <li class="has-submenu open">
                    <a href="#" class="nav-link submenu-toggle active" onclick="toggleSubmenu(event)">
                        <span><i class="bi bi-file-text"></i> My Article</span>
                    </a>
                    <ul class="submenu">
                        <li><a href="/pages/articles.html" class="nav-link active">All Articles</a></li>
                        <li><a href="/pages/create-article.html" class="nav-link">Create Article</a></li>
                    </ul>
                </li>
                <li>
                    <a href="/pages/categories.html" class="nav-link">
                        <i class="bi bi-tags"></i>
                        Categories
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-link logout" onclick="handleLogout(event)">
                        <i class="bi bi-box-arrow-right"></i>
                        Logout
                    </a>
                </li>
            </ul>
        </nav>
    </aside>
    
    <!-- Main Content -->
    <div class="main-content">
        <!-- Top Navbar -->
        <nav class="top-navbar">
            <button class="navbar-toggle-btn" id="sidebarToggle" onclick="toggleSidebar()">
                <i class="bi bi-list"></i>
            </button>
            <div class="user-dropdown">
                <img src="https://ui-avatars.com/api/?name=User&background=4299e1&color=fff" alt="User Avatar" class="user-avatar" id="userAvatar">
                <div class="user-info">
                    <div class="user-name" id="userName">Loading...</div>
                </div>
            </div>
        </nav>
        
        <!-- Articles Content -->
        <div class="container-fluid p-4">
            <!-- Page Header -->
            <div class="mb-4">
                <h1 class="h2 fw-bold mb-1">All Articles</h1>
                <p class="text-muted">អត្ថបទទាំងអស់</p>
            </div>
            
            <!-- Top Controls Row -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body">
                    <div class="row g-3 align-items-center">
                        <!-- Search -->
                        <div class="col-12 col-md-4">
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0">
                                    <i class="bi bi-search text-muted"></i>
                                </span>
                                <input type="text" id="searchInput" class="form-control border-start-0 ps-0" placeholder="Search articles...">
                            </div>
                        </div>
                        
                        <!-- View Toggle -->
                        <div class="col-12 col-md-4 text-center">
                            <div class="btn-group" role="group" aria-label="View toggle">
                                <button type="button" class="btn btn-outline-secondary active" id="cardViewBtn" onclick="switchView('card')">
                                    <i class="bi bi-grid-3x3-gap me-1"></i> Card
                                </button>
                                <button type="button" class="btn btn-outline-secondary" id="tableViewBtn" onclick="switchView('table')">
                                    <i class="bi bi-table me-1"></i> Table
                                </button>
                            </div>
                        </div>
                        
                        <!-- Create Button -->
                        <div class="col-12 col-md-4 text-md-end">
                            <a href="/pages/create-article.html" class="btn btn-dark">
                                <i class="bi bi-plus-circle me-1"></i>
                                Create New Article
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Card View (Default) -->
            <div id="cardView">
                <div id="articlesCardContainer">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Table View (Hidden by default) -->
            <div id="tableView" style="display: none;">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover mb-0" id="articlesTable">
                                <thead class="table-light">
                                    <tr>
                                        <th style="width: 80px;">Thumbnail</th>
                                        <th>Title</th>
                                        <th style="width: 150px;">Category</th>
                                        <th style="width: 150px;">Author</th>
                                        <th style="width: 120px;">Date</th>
                                        <th style="width: 120px;" class="text-center">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="articlesTableBody">
                                    <tr>
                                        <td colspan="6" class="text-center py-5">
                                            <div class="spinner-border text-primary" role="status">
                                                <span class="visually-hidden">Loading...</span>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Pagination -->
            <nav aria-label="Articles pagination" class="mt-4">
                <ul class="pagination justify-content-center" id="paginationContainer">
                </ul>
            </nav>
        </div>
    </div>
    
    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <i class="bi bi-info-circle me-2" id="toastIcon"></i>
                <strong class="me-auto" id="toastTitle">Notification</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body" id="toastMessage">
            </div>
        </div>
    </div>
    
    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS -->
    <script src="../js/config.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    
    <script>
        // Global variables
        let currentPage = 1;
        let totalPages = 1;
        let currentSearch = '';
        let currentView = 'card';
        let allArticles = [];
        let currentUser = null;
        
        // Sidebar toggle for mobile
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('show');
            overlay.classList.toggle('show');
        }
        
        // Submenu toggle
        function toggleSubmenu(event) {
            event.preventDefault();
            const parent = event.currentTarget.closest('.has-submenu');
            parent.classList.toggle('open');
        }
        
        // Handle logout
        async function handleLogout(event) {
            event.preventDefault();
            if (confirm('Are you sure you want to logout?')) {
                logout();
            }
        }
        
        // Show toast notification
        function showToast(message, type = 'info') {
            const toastEl = document.getElementById('liveToast');
            const toastIcon = document.getElementById('toastIcon');
            const toastTitle = document.getElementById('toastTitle');
            const toastMessage = document.getElementById('toastMessage');
            const toastHeader = toastEl.querySelector('.toast-header');
            
            // Set icon and color based on type
            toastHeader.className = 'toast-header';
            if (type === 'success') {
                toastIcon.className = 'bi bi-check-circle-fill text-success me-2';
                toastTitle.textContent = 'Success';
                toastHeader.classList.add('bg-success', 'text-white');
            } else if (type === 'error') {
                toastIcon.className = 'bi bi-exclamation-triangle-fill text-danger me-2';
                toastTitle.textContent = 'Error';
                toastHeader.classList.add('bg-danger', 'text-white');
            } else if (type === 'warning') {
                toastIcon.className = 'bi bi-exclamation-circle-fill text-warning me-2';
                toastTitle.textContent = 'Warning';
                toastHeader.classList.add('bg-warning');
            } else {
                toastIcon.className = 'bi bi-info-circle-fill text-primary me-2';
                toastTitle.textContent = 'Info';
                toastHeader.classList.add('bg-info', 'text-white');
            }
            
            toastMessage.textContent = message;
            const toast = new bootstrap.Toast(toastEl);
            toast.show();
        }
        
        // Switch view (card/table)
        function switchView(view) {
            currentView = view;
            localStorage.setItem('articlesView', view);
            
            const cardView = document.getElementById('cardView');
            const tableView = document.getElementById('tableView');
            const cardBtn = document.getElementById('cardViewBtn');
            const tableBtn = document.getElementById('tableViewBtn');
            
            if (view === 'card') {
                cardView.style.display = 'block';
                tableView.style.display = 'none';
                cardBtn.classList.add('active');
                tableBtn.classList.remove('active');
            } else {
                cardView.style.display = 'none';
                tableView.style.display = 'block';
                cardBtn.classList.remove('active');
                tableBtn.classList.add('active');
            }
            
            renderArticles();
        }
        
        // Load articles from API
        async function loadArticles() {
            try {
                const response = await articlesAPI.getAll({
                    page: currentPage,
                    perPage: 12,
                    search: currentSearch
                });
                
                allArticles = response.data || [];
                totalPages = response.pages || 1;
                
                renderArticles();
                renderPagination();
            } catch (error) {
                console.error('Load articles error:', error);
                showToast('Failed to load articles', 'error');
            }
        }
        
        // Render articles in card view
        function renderCardView() {
            const container = document.getElementById('articlesCardContainer');
            
            if (allArticles.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-5">
                        <i class="bi bi-inbox display-1 text-muted"></i>
                        <h3 class="mt-3 text-muted">No Articles Found</h3>
                        <p class="text-muted">There are no articles to display at the moment.</p>
                        <a href="/pages/create-article.html" class="btn btn-primary mt-3">
                            <i class="bi bi-plus-circle me-1"></i> Create Your First Article
                        </a>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = `
                <div class="row g-4">
                    ${allArticles.map(article => `
                        <div class="col-12 col-md-6 col-lg-4">
                            <div class="card h-100 border-0 shadow-sm hover-card" onclick="viewArticle(${article.id})" style="cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;">
                                ${article.thumbnail ? `
                                    <img src="${getImageUrl(article.thumbnail)}" 
                                         class="card-img-top" 
                                         alt="${sanitizeHTML(article.title)}"
                                         style="height: 200px; object-fit: cover; aspect-ratio: 16/9;">
                                ` : `
                                    <div class="card-img-top bg-light d-flex align-items-center justify-content-center" 
                                         style="height: 200px; aspect-ratio: 16/9;">
                                        <i class="bi bi-file-text display-1 text-muted"></i>
                                    </div>
                                `}
                                <div class="card-body d-flex flex-column">
                                    <div class="mb-2">
                                        <span class="badge bg-primary">${sanitizeHTML(article.category?.name || 'Uncategorized')}</span>
                                    </div>
                                    <h5 class="card-title fw-bold mb-2">${sanitizeHTML(article.title)}</h5>
                                    <p class="card-text text-muted flex-grow-1" style="display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;">
                                        ${sanitizeHTML(truncateText(article.content, 120))}
                                    </p>
                                    <div class="card-footer bg-transparent border-0 p-0 mt-3">
                                        <div class="d-flex align-items-center">
                                            <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(article.creator?.firstName || 'U')}+${encodeURIComponent(article.creator?.lastName || 'U')}&size=32&background=4299e1&color=fff" 
                                                 alt="${sanitizeHTML(article.creator?.firstName || '')} ${sanitizeHTML(article.creator?.lastName || '')}"
                                                 class="rounded-circle me-2"
                                                 style="width: 32px; height: 32px;">
                                            <div class="small">
                                                <div class="fw-semibold">${sanitizeHTML(article.creator?.firstName || '')} ${sanitizeHTML(article.creator?.lastName || '')}</div>
                                                <div class="text-muted">${formatDate(article.createdAt)}</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            
            // Add hover effect
            const style = document.createElement('style');
            style.textContent = `
                .hover-card:hover {
                    transform: translateY(-5px);
                    box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15) !important;
                }
            `;
            if (!document.getElementById('hover-card-style')) {
                style.id = 'hover-card-style';
                document.head.appendChild(style);
            }
        }
        
        // Render articles in table view
        function renderTableView() {
            const tbody = document.getElementById('articlesTableBody');
            
            if (allArticles.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center py-5">
                            <i class="bi bi-inbox display-1 text-muted"></i>
                            <h5 class="mt-3 text-muted">No Articles Found</h5>
                            <p class="text-muted mb-0">There are no articles to display at the moment.</p>
                        </td>
                    </tr>
                `;
                return;
            }
            
            tbody.innerHTML = allArticles.map(article => {
                const isOwner = currentUser && article.creator?.id === currentUser.id;
                
                return `
                    <tr>
                        <td>
                            ${article.thumbnail ? `
                                <img src="${getImageUrl(article.thumbnail)}" 
                                     alt="${sanitizeHTML(article.title)}"
                                     class="rounded"
                                     style="width: 60px; height: 60px; object-fit: cover;">
                            ` : `
                                <div class="bg-light rounded d-flex align-items-center justify-content-center"
                                     style="width: 60px; height: 60px;">
                                    <i class="bi bi-file-text text-muted"></i>
                                </div>
                            `}
                        </td>
                        <td>
                            <div class="fw-semibold">${sanitizeHTML(article.title)}</div>
                            <small class="text-muted">${sanitizeHTML(truncateText(article.content, 60))}</small>
                        </td>
                        <td>
                            <span class="badge bg-primary">${sanitizeHTML(article.category?.name || 'Uncategorized')}</span>
                        </td>
                        <td>
                            <div class="d-flex align-items-center">
                                <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(article.creator?.firstName || 'U')}+${encodeURIComponent(article.creator?.lastName || 'U')}&size=24&background=4299e1&color=fff" 
                                     alt="${sanitizeHTML(article.creator?.firstName || '')} ${sanitizeHTML(article.creator?.lastName || '')}"
                                     class="rounded-circle me-2"
                                     style="width: 24px; height: 24px;">
                                <small>${sanitizeHTML(article.creator?.firstName || '')} ${sanitizeHTML(article.creator?.lastName || '')}</small>
                            </div>
                        </td>
                        <td>
                            <small>${formatDate(article.createdAt)}</small>
                        </td>
                        <td class="text-center">
                            <div class="btn-group btn-group-sm" role="group">
                                <button type="button" class="btn btn-outline-primary" onclick="event.stopPropagation(); viewArticle(${article.id})" title="View">
                                    <i class="bi bi-eye"></i>
                                </button>
                                ${isOwner ? `
                                    <button type="button" class="btn btn-outline-warning" onclick="event.stopPropagation(); editArticle(${article.id})" title="Edit">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <button type="button" class="btn btn-outline-danger" onclick="event.stopPropagation(); deleteArticle(${article.id})" title="Delete">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                ` : ''}
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }
        
        // Render articles based on current view
        function renderArticles() {
            if (currentView === 'card') {
                renderCardView();
            } else {
                renderTableView();
            }
        }
        
        // Render pagination
        function renderPagination() {
            const container = document.getElementById('paginationContainer');
            
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }
            
            let paginationHTML = '';
            
            // Previous button
            paginationHTML += `
                <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                    <a class="page-link" href="#" onclick="changePage(${currentPage - 1}); return false;">
                        <i class="bi bi-chevron-left"></i>
                    </a>
                </li>
            `;
            
            // Page numbers
            const maxVisible = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
            let endPage = Math.min(totalPages, startPage + maxVisible - 1);
            
            if (endPage - startPage + 1 < maxVisible) {
                startPage = Math.max(1, endPage - maxVisible + 1);
            }
            
            if (startPage > 1) {
                paginationHTML += `
                    <li class="page-item">
                        <a class="page-link" href="#" onclick="changePage(1); return false;">1</a>
                    </li>
                `;
                if (startPage > 2) {
                    paginationHTML += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
                }
            }
            
            for (let i = startPage; i <= endPage; i++) {
                paginationHTML += `
                    <li class="page-item ${i === currentPage ? 'active' : ''}">
                        <a class="page-link" href="#" onclick="changePage(${i}); return false;">${i}</a>
                    </li>
                `;
            }
            
            if (endPage < totalPages) {
                if (endPage < totalPages - 1) {
                    paginationHTML += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
                }
                paginationHTML += `
                    <li class="page-item">
                        <a class="page-link" href="#" onclick="changePage(${totalPages}); return false;">${totalPages}</a>
                    </li>
                `;
            }
            
            // Next button
            paginationHTML += `
                <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
                    <a class="page-link" href="#" onclick="changePage(${currentPage + 1}); return false;">
                        <i class="bi bi-chevron-right"></i>
                    </a>
                </li>
            `;
            
            container.innerHTML = paginationHTML;
        }
        
        // Change page
        function changePage(page) {
            if (page < 1 || page > totalPages || page === currentPage) return;
            currentPage = page;
            loadArticles();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        // View article detail
        function viewArticle(id) {
            window.location.href = `/pages/article-detail.html?id=${id}`;
        }
        
        // Edit article
        function editArticle(id) {
            window.location.href = `/pages/create-article.html?id=${id}`;
        }
        
        // Delete article
        async function deleteArticle(id) {
            if (!confirm('Are you sure you want to delete this article?')) {
                return;
            }
            
            try {
                await articlesAPI.delete(id);
                showToast('Article deleted successfully', 'success');
                loadArticles();
            } catch (error) {
                console.error('Delete article error:', error);
                showToast('Failed to delete article', 'error');
            }
        }
        
        // Initialize search
        function initSearch() {
            let searchTimeout;
            const searchInput = document.getElementById('searchInput');
            
            searchInput.addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    currentSearch = e.target.value;
                    currentPage = 1;
                    loadArticles();
                }, 500);
            });
        }
        
        // Initialize page
        async function initPage() {
            // Check authentication
            if (!isAuthenticated()) {
                window.location.href = '/index.html';
                return;
            }
            
            // Load user info
            const userData = getUserData();
            if (userData) {
                currentUser = userData;
                const fullName = `${userData.firstName} ${userData.lastName}`;
                document.getElementById('userName').textContent = fullName;
                
                // Update avatar
                const avatar = document.getElementById('userAvatar');
                avatar.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(fullName)}&background=4299e1&color=fff`;
            }
            
            // Load saved view preference
            const savedView = localStorage.getItem('articlesView');
            if (savedView && (savedView === 'card' || savedView === 'table')) {
                currentView = savedView;
                if (currentView === 'table') {
                    switchView('table');
                }
            }
            
            // Initialize search
            initSearch();
            
            // Load articles
            await loadArticles();
        }
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
