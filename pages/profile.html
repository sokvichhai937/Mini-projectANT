<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រវត្តិរូបផ្ទាល់ខ្លួន - Blog Management System</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="navbar-content">
                <a href="/pages/dashboard.html" class="navbar-brand">📝 Blog System</a>
                <button class="navbar-toggle" onclick="toggleMenu()">☰</button>
                <ul class="navbar-menu" id="navbarMenu">
                    <li><a href="/pages/dashboard.html">ផ្ទាំងគ្រប់គ្រង</a></li>
                    <li><a href="/pages/articles.html">អត្ថបទ</a></li>
                    <li><a href="/pages/categories.html">ប្រភេទ</a></li>
                    <li><a href="/pages/profile.html" class="active">ប្រវត្តិរូប</a></li>
                    <li><a href="#" onclick="logout()">ចាកចេញ</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main>
        <div class="container">
            <h1 class="mb-4">ប្រវត្តិរូបផ្ទាល់ខ្លួន</h1>
            
            <div class="row">
                <!-- Profile Info Card -->
                <div class="col-12 col-md-4 mb-4">
                    <div class="card">
                        <div class="card-body text-center">
                            <div class="mb-3">
                                <img id="profileAvatar" src="/assets/images/placeholder.jpg" alt="Avatar" class="avatar avatar-lg" style="width: 150px; height: 150px;">
                            </div>
                            <h3 id="profileName">Loading...</h3>
                            <p class="text-muted" id="profileEmail">Loading...</p>
                            
                            <div class="mt-3">
                                <input type="file" id="avatarInput" accept="image/*" style="display: none;" onchange="handleAvatarUpload(event)">
                                <button class="btn btn-primary btn-sm" onclick="document.getElementById('avatarInput').click()">
                                    📤 Upload Avatar
                                </button>
                                <button class="btn btn-danger btn-sm" onclick="handleAvatarDelete()" id="deleteAvatarBtn">
                                    🗑️ Delete
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Edit Profile Form -->
                <div class="col-12 col-md-8">
                    <div class="card">
                        <div class="card-header">
                            <h4>កែសម្រួលព័ត៌មាន</h4>
                        </div>
                        <div class="card-body">
                            <form id="profileForm">
                                <div class="form-group">
                                    <label for="firstName" class="form-label">នាមខ្លួន</label>
                                    <input type="text" id="firstName" class="form-control" required>
                                    <span class="invalid-feedback" id="firstNameError"></span>
                                </div>
                                
                                <div class="form-group">
                                    <label for="lastName" class="form-label">នាមត្រកូល</label>
                                    <input type="text" id="lastName" class="form-control" required>
                                    <span class="invalid-feedback" id="lastNameError"></span>
                                </div>
                                
                                <div class="form-group">
                                    <label for="email" class="form-label">អ៊ីមែល</label>
                                    <input type="email" id="email" class="form-control" required>
                                    <span class="invalid-feedback" id="emailError"></span>
                                </div>
                                
                                <div class="form-group">
                                    <button type="submit" class="btn btn-primary" id="updateBtn">
                                        💾 រក្សាទុកការផ្លាស់ប្តូរ
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 Blog Management System. All rights reserved.</p>
        </div>
    </footer>

    <script src="../js/config.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/profile.js"></script>
    
    <script>
        function toggleMenu() {
            document.getElementById('navbarMenu').classList.toggle('active');
        }
    </script>
</body>
</html>
